term: Jacks or better
aka:
  - jackpots
  - jacks to open
definition: "A five-card draw rule where you may open the pre-draw betting only with a pair of jacks or better. If you split your openers by discarding the cards that made the opening hand, you have to prove them at showdown. If nobody can open, everyone antes again and the cards are redealt. The Gardena version is where the word 'jackpot' comes from."
