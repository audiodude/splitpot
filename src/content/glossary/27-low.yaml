term: Deuce-to-seven low
aka:
  - 2-7
  - Kansas City lowball
definition: "Low hand ranking that's basically \"the worst high hand wins.\"
  Aces are always high, straights and flushes count against you, so the best
  hand is 7-5-4-3-2 with mixed suits (the \"number one\"). A-2-3-4-5 is just
  ace-high: terrible."
