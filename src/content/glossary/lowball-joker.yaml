term: Joker (lowball)
aka:
  - fitter
  - bug
definition: "The traditional extra card in California lowball. It plays as the lowest card not already in your hand, so 8-6-4-A-joker is 8-6-4-2-A. It is not wild and can never pair you. Rooms disagree on whether it's in the deck by default, so check what's posted."
