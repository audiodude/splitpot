- id: a5-low
  term: Ace-to-five low
  aka: [A-5, California lowball ranking]
  definition: >-
    Low hand ranking where aces are the lowest card and straights and flushes don't count against you.
    The best possible hand is A-2-3-4-5 (the <a href="#wheel">wheel</a>). Pairs are bad: any unpaired hand beats any pair.
    Hands are compared from the highest card down, so 8-6-4-2-A beats 8-7-3-2-A.
- id: 27-low
  term: Deuce-to-seven low
  aka: [2-7, Kansas City lowball]
  definition: >-
    Low hand ranking that's basically "the worst high hand wins." Aces are always high, straights and flushes count
    against you, so the best hand is 7-5-4-3-2 with mixed suits (the "number one"). A-2-3-4-5 is just ace-high: terrible.
- id: wheel
  term: Wheel
  aka: [bicycle]
  definition: >-
    A-2-3-4-5. The best hand in ace-to-five low, a five-high straight in high games, and a lousy ace-high nothing in deuce-to-seven.
- id: badugi
  term: Badugi (hand)
  definition: >-
    A four-card hand with four different suits and four different ranks. Aces are low (except in Badeucy, where they are high). A four-card badugi beats any
    three-card hand; among equals, compare highest card down (lowest wins). If you have duplicate suits or ranks you
    play the biggest clean subset, e.g. a "three-card" hand.
- id: eight-or-better
  term: Eight-or-better
  aka: [qualifier, "8-or-better"]
  definition: >-
    In hi-lo split games, a low hand only counts if it's five unpaired cards all 8 or lower (aces low). No qualifying low?
    The high hand takes the whole pot.
- id: scoop
  term: Scoop
  definition: Winning the entire pot in a split-pot game, both halves. The thing everyone is actually trying to do.
- id: quartered
  term: Quartered
  aka: [getting quartered]
  definition: >-
    Tying for one half of a split pot, so you win a quarter of it. In multiway pots this can mean you lose money on a hand you "won."
- id: counterfeit
  term: Counterfeit
  aka: [counterfeited]
  definition: >-
    When the board pairs one of your key cards and ruins your hand. Classic case: you hold A-2 for low, an ace or deuce
    lands on the board, and your low gets a lot worse because you can't use the paired card twice.
- id: nut-low
  term: Nut low
  definition: The best possible low hand given the cards showing. On a 3-5-8 board in Omaha hi-lo, A-2 in your hand is the nut low.
- id: omaha-rule
  term: Two-and-three rule
  aka: [Omaha rule, "exactly two"]
  definition: >-
    In Omaha-style games you must use exactly two cards from your hand and exactly three from the board. Not one, not
    four. Four hearts on board plus one in your hand is not a flush.
- id: limit
  term: Limit
  aka: [fixed limit, FL]
  definition: >-
    Bets and raises come in fixed sizes: the small bet on early streets, the big bet (double) on later streets. Usually a cap of one bet and three or four raises per round.
- id: pot-limit
  term: Pot-limit
  aka: [PL]
  definition: The biggest bet or raise allowed is the size of the pot (counting the call you'd make first). Standard for Omaha-style games and Drawmaha.
- id: no-limit
  term: No-limit
  aka: [NL]
  definition: You can bet everything in front of you at any time. Common for Hold'em and 2-7 Single Draw.
- id: blinds
  term: Blinds
  definition: Forced bets posted before the deal by the two players left of the button. Board and draw games use blinds; stud games use antes and a bring-in.
- id: button
  term: Button
  aka: [dealer button]
  definition: >-
    Marks the nominal dealer. Acts last after the first betting round in board and draw games, which is the best seat at the table.
- id: draw
  term: Draw
  aka: [drawing round]
  definition: >-
    In draw games, each player may discard any number of cards and get replacements from the deck. Triple-draw games have three of these, each followed by a betting round.
- id: snow
  term: Snow
  aka: [pat, standing pat]
  definition: >-
    Standing pat is drawing zero cards. Snowing is standing pat on garbage to represent a made hand.
- id: hi-lo
  term: Hi-lo split
  aka: [split pot, eight-or-better games]
  definition: Half the pot goes to the best high hand, half to the best low hand (if any low qualifies).
- id: freeroll
  term: Freeroll
  definition: >-
    You're guaranteed at least half the pot and have a shot at the other half. Your opponent can't win; they can only stop you from scooping.
