    url: https://www.cardplayer.com/rules-of-poker/glossary/big-o-poker
  - title: Mixed Game Masters — PLO8 rules (odd chip variations)
    url: https://mixedgamemasters.com/strategy/pot-limit-omaha-hi-lo/rules/
  - title: Wikipedia — Omaha hold 'em
    url: https://en.wikipedia.org/wiki/Omaha_hold_%27em
examples:
  - id: five-suited
    title: Five spades in hand, still no flush
    board: 2s 9s Kd 6h 4c
    players:
      - { name: Alice, cards: As 3s Ks Qs Js }
      - { name: Bob, cards: 9h 9d 7c 3d 8d }
    winners: { high: [Bob], low: [Alice] }
  - id: wheel-scoop
    title: The wheel makes the nut low and a straight
    board: 2c 3d 4h Ks 9c
    players:
      - { name: Alice, cards: Ad 5s Kh Qd Jc }
      - { name: Bob, cards: 9d 9h 6d 7h Qs }
    winners: { high: [Alice], low: [Alice] }
  - id: three-way-low
    title: Three players hold A-2 and share the low
    board: 3c 4d 8h Kc Kd
    players:
      - { name: Alice, cards: As 2s 9c 9d Th }
      - { name: Bob, cards: Ah 2h Qc Qd 7s }
      - { name: Carol, cards: Ac 2d Js Jd 5c }
    winners: { high: [Bob], low: [Alice, Bob, Carol] }
