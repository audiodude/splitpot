name: Big O
abbrevs: [Big O, 5-Card O8, PLO8-5]
nicknames: [Five-Card Omaha Hi-Lo, 5 Card Pot-Limit Omaha Hi-Lo 8 or Better, Big-O]
summary: Omaha Hi-Lo with five hole cards instead of four, so everyone holds A-2 and the nuts is the only hand that matters.
family: board
structures: [pot-limit, limit]
holeCards: 5
draws: 0
showdown: omaha-8
parent: omaha-hi-lo
related: [omaha-hi-lo, big-easy, omaha-hi-lo-regular, courchevel-hi-lo, ultimate-big-o, 3-2-1, 5-card-plo]
sources:
  - title: WSOP 2026 Live-Action Rules (Big O)
    url: https://assets.wsopcdn.com/wsop/853ee602-e1e9-4019-a0cf-381419d805c6.pdf
  - title: PokerStars — 5-card Omaha Hi/Lo
    url: https://www.pokerstars.com/poker/games/omaha/5-card-high-low/
  - title: PokerNews — Big O rules
    url: https://www.pokernews.com/poker-rules/big-o.htm
