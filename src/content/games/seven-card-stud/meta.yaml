examples:
  - id: wheel-beats-two-pair
    title: Best five of seven, and the ace plays low in a straight
    players:
      - { name: Alice, cards: Ks Kd 7c 7h 2s 9s 4d }
      - { name: Bob, cards: Ah 2d 3s 4c 5h Kc 9d }
    winners: { high: [Bob] }
  - id: suits-dont-matter
    title: Same straight, different suits, split pot
    players:
      - { name: Alice, cards: Ah 2d 3s 4c 5h Kd 9c }
      - { name: Bob, cards: As 2c 3h 4d 5s Kc 9d }
    winners: { high: [Alice, Bob] }
  - id: flush-over-trips
    title: Three sevens lose to a flush you can't see on the table
    players:
      - { name: Alice, cards: 7s 7h 7d Ks 2c 9c 4d }
      - { name: Bob, cards: Ah Jh 9h 6h 3h Kd 2s }
    winners: { high: [Bob] }
