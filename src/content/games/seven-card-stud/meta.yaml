name: Seven-Card Stud
abbrevs: [Stud, 7CS, Stud High]
nicknames: [Seven-Toed Pete, Down the River]
summary: No community cards, no blinds, no button; seven cards each, four face up for everyone to read, best five-card high hand wins.
family: stud
structures: [limit]
holeCards: 7
draws: 0
showdown: stud
related: [seven-card-stud-hi-lo, seven-card-stud-hi-lo-no-qualifier, razz, five-card-stud, super-stud, mexican-stud]
