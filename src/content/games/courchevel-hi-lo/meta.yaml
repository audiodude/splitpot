examples:
  - id: king-door
    title: A king door card, and the low still arrives
    board: Ks 4d 7h 2s 6c
    players:
      - { name: Alice, cards: Ad 3c 9h 9d Jh }
      - { name: Bob, cards: Kh Kd 8d 8s Td }
    winners: { high: [Bob], low: [Alice] }
  - id: no-low
    title: A high door card and a high flop mean no low
    board: Kc Qd 3h 9s 2d
    players:
      - { name: Alice, cards: Ac 4s 5d 6s 7c }
      - { name: Bob, cards: Kd Ks Jh Jc 8s }
    winners: { high: [Bob], low: [] }
  - id: ace-door
    title: An ace door card helps a wheel scoop
    board: As 2d 6h 9c 4s
    players:
      - { name: Alice, cards: 3c 5d Kd Kc Qc }
      - { name: Bob, cards: Ah 2h 6d 6c 9h }
    winners: { high: [Alice], low: [Alice] }
