examples:
  - id: nut-low-bad-omaha
    title: The nut low that can't win anything else
    board: As Kd Qc Jh 9s
    players:
      - { name: Eve, cards: 7s 5d 4c 3h 2s }
      - { name: Frank, cards: Ah Kh Th Ts 8d }
    winners: { draw: [Eve], omaha: [Frank] }
  - id: straight-is-bad
    title: A made straight is a bad 2-7 hand
    board: 9h 8c 7d Ks 2h
    players:
      - { name: Alice, cards: 6c 5d 4h 3s 2c }
      - { name: Bob, cards: Kh Qd Jc 9s 8d }
    winners: { draw: [Bob], omaha: [Alice] }
  - id: wheel-is-ace-high
    title: A-5-4-3-2 is just an ace-high
    board: 9s 9c 6h Kd Qh
    players:
      - { name: Gina, cards: Ac 5d 4h 3s 2c }
      - { name: Hal, cards: 9h 9d 4c 3d 2s }
    winners: { draw: [Gina], omaha: [Hal] }
