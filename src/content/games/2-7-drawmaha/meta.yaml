name: 2-7 Drawmaha
abbrevs: [Drawmaha 2-7, Dramaha 2-7, Deuce-to-Seven Drawmaha]
nicknames: [Deuce-to-Seven Dramaha]
summary: Drawmaha with a deuce-to-seven low for the draw half. Your perfect 7-5-4-3-2 is also a terrible Omaha hand.
family: hybrid
structures: [limit, pot-limit]
holeCards: 5
draws: 1
showdown: drawmaha-27
parent: drawmaha
related: [2-7-triple-draw, 2-7-single-draw, a-5-drawmaha, drawmaha-49]
