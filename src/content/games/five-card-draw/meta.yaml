examples:
  - id: flush-beats-pair
    title: Same ranking as Hold'em, just with no board
    players:
      - { name: Mia, cards: Kh Kd 8s 5c 2h }
      - { name: Noel, cards: As Js 9s 6s 3s }
    winners: { high: [Noel] }
  - id: kickers
    title: Same pair, so the kicker decides
    players:
      - { name: Olive, cards: Kh Kd Qs 7c 3d }
      - { name: Pat, cards: Ks Kc Jd 9h 4s }
    winners: { high: [Olive] }
  - id: wheel-straight
    title: The wheel is still a straight in high poker
    players:
      - { name: Rex, cards: As 2d 3c 4h 5s }
      - { name: Sue, cards: Qh Qd Qc 9s 3h }
    winners: { high: [Rex] }
  - id: chop
    title: Same ranks, different suits, split pot
    players:
      - { name: Tom, cards: Ah Kd 9c 7s 2d }
      - { name: Una, cards: As Kc 9d 7h 2s }
    winners: { high: [Tom, Una] }
