name: Five-Card Draw
abbrevs: [5CD, NL 5 Card Draw, Draw High]
nicknames: [California Draw, Guts to Open, Jackpots, Draw Poker]
summary: The poker you learned at your cousin's kitchen table. Five cards, one swap, best normal poker hand wins.
family: draw
structures: [no-limit, pot-limit, limit]
