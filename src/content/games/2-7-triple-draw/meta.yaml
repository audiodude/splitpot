examples:
  - id: the-number-one
    title: The nuts loses to nobody, and a smooth eight loses to the nuts
    players:
      - { name: Alice, cards: 7s 5d 4c 3h 2s }
      - { name: Bob, cards: 8h 5s 4d 3c 2h }
    winners: { low: [Alice] }
  - id: straights-and-flushes
    title: A straight and a flush both lose to king-high garbage
    players:
      - { name: Carl, cards: 6h 5d 4c 3s 2d }
      - { name: Eve, cards: 7h 5h 4h 3h 2h }
      - { name: Dana, cards: Kd Jc 9h 7s 4d }
    winners: { low: [Dana] }
  - id: ace-is-high
    title: A-2-3-4-5 is ace-high, so it loses to any king-high hand
    players:
      - { name: Frank, cards: As 2d 3c 4h 5s }
      - { name: Gina, cards: Kc Qh Jd 9s 8h }
    winners: { low: [Gina] }
  - id: chop
    title: Identical hands split, suits don't break ties
    players:
      - { name: Ivy, cards: 8s 6d 4c 3h 2s }
      - { name: Jon, cards: 8h 6c 4d 3s 2d }
    winners: { low: [Ivy, Jon] }
