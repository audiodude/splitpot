name: 2-7 Triple Draw
abbrevs: [2-7 TD, 27TD, Deuce-to-Seven Triple Draw, 2-7 Lowball Triple Draw]
nicknames: [Deuce, Triple Draw]
summary: Five cards, three chances to draw, and the worst-looking hand wins, with aces high and straights and flushes counted against you.
family: draw
structures: [limit, pot-limit]
holeCards: 5
draws: 3
showdown: draw-27
related: [2-7-single-draw, a-5-triple-draw, badugi, badeucy, badacey, archie]
