name: 2-7 Single Draw
abbrevs: [NL 2-7, 2-7 SD, NL 2-7 Single Draw, No-Limit 2-7 Lowball Draw]
nicknames: [Kansas City Lowball, Billy Baxter Lowball, Deuce-to-Seven Draw, Low Poker]
