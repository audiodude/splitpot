    title: The one-card draw that wrecked itself
    players:
      - { name: Nate, cards: 7h 6d 5c 4s 3h, discards: Ac }
      - { name: Olga, cards: Ks Qd Jh 9c 8s }
    winners: { low: [Olga] }
