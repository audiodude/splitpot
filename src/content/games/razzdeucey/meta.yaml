examples:
  - id: scoop
    title: 2-3-4-5-7 with four suits is the dream
    players:
      - { name: Alice, cards: 2c 3d 4h 5s 7c Kd Qh }
      - { name: Bob, cards: 2h 3c 4d 6s 8h Ks Kc }
    winners: { low: [Alice], badugi: [Alice] }
  - id: ace-trap
    title: A-2-3-4 is the worst four-card badugi, and K-high beats it
    players:
      - { name: Alice, cards: As 2h 3c 4d 2d 3h 4c }
      - { name: Bob, cards: Ks Qh Jd Tc 9s 9h 8d }
    winners: { low: [Bob], badugi: [Bob] }
  - id: nut-low-loses-badugi
    title: The nut low, but all clubs and diamonds
    players:
      - { name: Alice, cards: 2c 3c 4c 5d 7d Kh Qs }
      - { name: Bob, cards: Js Th 9d 8c Ah Ac Kd }
    winners: { low: [Alice], badugi: [Bob] }
