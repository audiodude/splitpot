name: Razzdeucey
abbrevs: [Razzdeucy, Razzduci, Razz-deucey, Razz/Baduci]
nicknames: [Badeucey in stud form, 2-7 Razzdugi, Super Stud Badeucey]
summary: "Stud-style Badeucey: half the pot to the best 2-7 low, half to the best aces-high badugi, from the same seven cards. Despite the name, there is no A-5 razz in it."
family: stud
structures: [limit]
holeCards: 7
draws: 0
showdown: razzdeucey
parent: razzdugi
related: [razzdugi, 2-7-razz, razz, super-stud, badeucy]
