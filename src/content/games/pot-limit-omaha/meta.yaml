examples:
  - id: one-heart
    title: Four hearts on the board and one in your hand is not a flush
    board: 9h 4h 2c Jh Qh
    players:
      - { name: Alice, cards: Ah Qc 7d 6d }
      - { name: Bob, cards: 9c 9d Kd Ts }
    winners: { high: [Bob] }
  - id: cant-play-board
    title: A royal flush on the board is nobody's royal flush
    board: Ac Kc Qc Jc Tc
    players:
      - { name: Alice, cards: Ad Kd 7h 8s }
      - { name: Bob, cards: 2c 3c 7d 8d }
    winners: { high: [Bob] }
  - id: two-straights
    title: Two different pairs of hole cards make two different straights
    board: 8h 9c Ts 2d 2c
    players:
      - { name: Alice, cards: Jc Qd 5s 5d }
      - { name: Bob, cards: 7h 6h Ac Kd }
    winners: { high: [Alice] }
