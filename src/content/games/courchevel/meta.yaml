examples:
  - id: set-over-set
    title: The door card gave Alice a set, but the flop gave Bob a bigger one
    board: 8h Kd 3c Js 2d
    players:
      - { name: Alice, cards: 8c 8d 5s 6h 9c }
      - { name: Bob, cards: Kc Ks Tc 4d 7s }
    winners: { high: [Bob] }
  - id: door-flush
    title: Still exactly two from your hand and three from the board
    board: Qc 2c 7c Kh 4d
    players:
      - { name: Alice, cards: Ac 9c 3s 3d Js }
      - { name: Bob, cards: Qh Qd Kd Ks 5s }
    winners: { high: [Alice] }
