name: Badugi Drawmaha
abbrevs: [Dramadugi, DramaDugi, Drawmaha Badugi, Drawmaha Low-Dugi, Dramaha Low-Dugi, Drawmaha-Dugi]
nicknames: [Dramadugi, Low-Dugi]
summary: Drawmaha where the draw half is the best badugi from your five cards. Rainbow low cards are great, except at Omaha.
family: hybrid
structures: [limit, pot-limit]
holeCards: 5
draws: 1
showdown: drawmaha-badugi
parent: drawmaha
related: [badugi, badacey, badugi-high-drawmaha, 2-7-drawmaha]
sources:
