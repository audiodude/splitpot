    url: https://assets.wsopcdn.com/wsop/853ee602-e1e9-4019-a0cf-381419d805c6.pdf
  - title: Wikipedia — Texas hold 'em
    url: https://en.wikipedia.org/wiki/Texas_hold_%27em
  - title: PokerListings — Limit Texas Hold'em rules
    url: https://www.pokerlistings.com/poker-rules/limit-texas-holdem
  - title: Poker TDA Rules (half-bet reopening, house limit on raises)
    url: https://www.pokertda.com/view-poker-tda-rules/
  - title: Wikipedia — H.O.R.S.E.
    url: https://en.wikipedia.org/wiki/H.O.R.S.E.
  - title: Wikipedia — The Poker Players Championship (10-game mix includes limit hold'em)
    url: https://en.wikipedia.org/wiki/The_Poker_Players_Championship
examples:
  - id: kicker
    title: Both pair kings, the better kicker takes it
    board: Ks 8d 4c 9h 2s
    players:
      - { name: Alice, cards: Kd Qc }
      - { name: Bob, cards: Kh Jc }
    winners: { high: [Alice] }
  - id: straight-chop
    title: The board is a straight and nobody beats it
    board: 5c 6d 7h 8s 9d
    players:
      - { name: Alice, cards: Kd 2c }
      - { name: Bob, cards: Qh 3d }
    winners: { high: [Alice, Bob] }
