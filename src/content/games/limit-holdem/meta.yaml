name: Limit Hold'em
abbrevs: [LHE, FLHE, Fixed-Limit Hold'em]
nicknames: [Limit, Fixed-limit Hold'em, the "H" in H.O.R.S.E.]
summary: Hold'em where you can only bet the fixed amount, so everybody calls with the draw and the raises come in even-sized steps.
family: board
structures: [limit]
holeCards: 2
draws: 0
showdown: holdem
parent: no-limit-holdem
related: [no-limit-holdem, pot-limit-omaha, omaha-hi-lo, pineapple]
sources:
