examples:
  - id: scoop
    title: A-2-3-4 rainbow plus a 5 is the nuts for both halves
    players:
      - { name: Alma, cards: As 2h 3d 4c 5s }
      - { name: Bruno, cards: 2s 3h 4d 5c 6h }
    winners: { badugi: [Alma], low: [Alma] }
  - id: one-way
    title: A perfect low that's easy to freeroll
    players:
      - { name: Cora, cards: 2h 4h 6h 7h Ac }
      - { name: Dmitri, cards: Ks Qd 9c 5h 5s }
    winners: { badugi: [Dmitri], low: [Cora] }
  - id: quartered
    title: Tie the badugi, lose the low
    players:
      - { name: Ann, cards: As 2h 3d 4c Ks }
      - { name: Ben, cards: Ah 2s 3c 4d 5h }
    winners: { badugi: [Ann, Ben], low: [Ben] }
