name: Badacey
abbrevs: [Badacy, Badaci]
nicknames: [A-5 Badugi]
summary: A-5 triple draw where half the pot goes to the best ace-to-five low and half to the best badugi, with the ace low in both.
family: draw
structures: [limit]
holeCards: 5
draws: 3
showdown: badacey
related: [badugi, badeucy, a-5-triple-draw, archie]
