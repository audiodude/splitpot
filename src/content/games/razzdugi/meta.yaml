name: Razzdugi
abbrevs: [Razzdacey, Razz-dacey, Razz/Badugi]
nicknames: [Super Razzdugi]
summary: Razz where the pot splits between the best A-5 razz low and the best badugi, both made from your same seven stud cards.
family: stud
structures: [limit]
holeCards: 7
draws: 0
showdown: razzdugi
parent: razz
related: [razz, razzdeucey, super-stud, action-razz, badugi, badacey, 2-7-razz]
sources:
  - title: WSOP 2026 Live-Action Rules (Razzdugi, rules 325-331)
    url: https://assets.wsopcdn.com/wsop/853ee602-e1e9-4019-a0cf-381419d805c6.pdf
  - title: BARGE Rulebook (Razzdugi, 2.50)
    url: https://www.barge.org/rulebook.pdf
  - title: The Festival Explains Razzdugi
    url: https://www.thefestival.com/the-festival-explains-razzdugi
  - title: Card Player Lifestyle — Mixed game poker rules
    url: https://cardplayerlifestyle.com/poker-tips-strategy/mixed-game-poker-rules/
  - title: Card Player — Spice up your home game, stud lowball variants
    url: https://www.cardplayer.com/cardplayer-poker-magazines/1632969-acr-poker-39-1/articles/1633666-spice-up-your-home-game-stud-lowball-variants
examples:
  - id: wheel-flush
    title: A suited wheel is a monster razz hand and a junk badugi
    players:
      - { name: Alice, cards: As 2s 3s 4s 5s Kd Qc }
      - { name: Bob, cards: Ah 2d 3c 6s 9h 9d Kc }
    winners: { low: [Alice], badugi: [Bob] }
  - id: scoop
    title: A-2-3-4 in four suits plus a 5 takes both halves
    players:
      - { name: Alice, cards: Ah 2d 3c 4s 5h Kd Qs }
      - { name: Bob, cards: As 2h 3d 5c 6c 7s Kc }
    winners: { low: [Alice], badugi: [Alice] }
  - id: three-card-badugi
    title: Nobody has four suits, so a three-card badugi beats a two-card one
    players:
      - { name: Alice, cards: Ks Qs 3d 4d 9h 8h 7h }
      - { name: Bob, cards: Ac 2c 3c 4c 5d 6d 7d }
    winners: { low: [Bob], badugi: [Alice] }
