name: Razz
abbrevs: [A-5 Razz, Stud Low]
nicknames: [Seven-card stud lowball, the R in HORSE]
summary: "Seven-card stud played backwards: lowest hand wins the whole pot, aces are low, straights and flushes don't count against you, and the king brings it in."
family: stud
structures: [limit]
holeCards: 7
draws: 0
showdown: razz
parent: seven-card-stud
