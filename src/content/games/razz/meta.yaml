examples:
  - id: flush-and-straight-dont-matter
    title: A suited wheel is still the nuts
    players:
      - { name: Alice, cards: Ah 2h 3h 4h 5h Kd Qc }
      - { name: Bob, cards: 6s 4s 3s 2s As Jd 9c }
    winners: { low: [Alice] }
  - id: compare-from-the-top
    title: Both have a six-low, so you compare the next card down
    players:
      - { name: Alice, cards: As Ad 2c 3h 4d 6s Kc }
      - { name: Bob, cards: Ac 2h 3s 5d 6c Kd Qs }
    winners: { low: [Alice] }
  - id: pair-trap
    title: Queen-high beats a pair of aces
    players:
      - { name: Alice, cards: As Ad 2c 2d 3h 3s 4c }
      - { name: Bob, cards: Kh Qd Js Tc 9h 9d 2h }
    winners: { low: [Bob] }
